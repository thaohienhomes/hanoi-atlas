<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Bản đồ 3D tương tác của Hà Nội: ẩm thực, du lịch và bất động sản, khám phá theo từng khu phố. An interactive 3D map of Hanoi's food, sights, and real estate."
    />
    <title>Hà Nội Atlas — Bản đồ 3D ẩm thực · du lịch · BĐS</title>

    <!-- Open Graph / social cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hà Nội Atlas" />
    <meta property="og:title" content="Hà Nội Atlas: Bản đồ 3D ẩm thực, du lịch & BĐS của Hà Nội" />
    <meta
      property="og:description"
      content="52 địa điểm ăn, chơi, ở trên bản đồ 3D tương tác — từ Phố cổ qua Hồ Tây đến Mỹ Đình. 52 places to eat, explore, and live across an interactive 3D Hanoi."
    />
    <meta property="og:image" content="./og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bản đồ 3D Hà Nội với các địa điểm ẩm thực, du lịch và bất động sản" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hà Nội Atlas: Bản đồ 3D ẩm thực, du lịch & BĐS" />
    <meta
      name="twitter:description"
      content="Khám phá Hà Nội theo từng khu phố trên bản đồ 3D tương tác."
    />
    <meta name="twitter:image" content="./og.jpg" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0b1017" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hà Nội Atlas" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="preload" href="./fonts/GeistVF.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app" class="atlas-shell">
      <canvas id="scene" aria-label="Bản đồ 3D tương tác các địa điểm Hà Nội"></canvas>
      <div id="labelsLayer" class="labels-layer" aria-hidden="false"></div>

      <div class="hud-left">
        <aside class="rail" aria-label="Điều hướng Hà Nội Atlas">
          <a class="brand" href="#" aria-label="Về trang chính Hà Nội Atlas">
            <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
              <!-- Map pin: the atlas mark. Balanced teardrop with a round
                   aperture, drawn upright so it reads at any size. -->
              <path
                fill="currentColor"
                fill-rule="evenodd"
                d="M16 29.5 C12.2 23.5 7.5 17.5 7.5 12 A8.5 8.5 0 1 1 24.5 12 C24.5 17.5 19.8 23.5 16 29.5 Z M16 8.8 A3.2 3.2 0 1 0 16 15.2 A3.2 3.2 0 1 0 16 8.8 Z"
              />
            </svg>
            <span class="brand__text">
              <h1>Hà Nội Atlas</h1>
              <span class="brand__sub">52 địa điểm · ăn ᐧ chơi ᐧ ở</span>
            </span>
          </a>

          <nav id="areaList" class="area-list" aria-label="Khám phá theo khu vực"></nav>

          <div id="pinLegend" class="pin-legend" aria-label="Lọc theo nhóm"></div>

          <div class="rail__foot">
            <a
              class="rail__cta"
              href="mailto:thaohienhomes@gmail.com?subject=%C4%90%E1%BB%81%20xu%E1%BA%A5t%20%C4%91%E1%BB%8Ba%20%C4%91i%E1%BB%83m%20cho%20H%C3%A0%20N%E1%BB%99i%20Atlas"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 4.6 5.3 10.7 6.6 12.2a.53.53 0 0 0 .8 0C13.7 19.7 19 13.6 19 9a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
              <span>Đề xuất địa điểm</span>
              <span class="rail__cta-arrow" aria-hidden="true">↗</span>
            </a>
            <p class="rail__hint"><kbd>↑</kbd><kbd>↓</kbd> khu vực · <kbd>⌘K</kbd> tìm kiếm · chạm vào pin</p>
            <p class="rail__credit">
              Dữ liệu chọn lọc thủ công · Dựng lại từ <a href="https://github.com/Nutlope/nyc-ai-atlas" target="_blank" rel="noreferrer">NYC AI Atlas</a> · 2026
            </p>
          </div>
        </aside>

        <section id="detailCard" class="detail-card is-hidden" aria-live="polite"></section>
      </div>

      <div class="hud-top-right">
        <button id="searchTrigger" class="search-trigger" type="button" aria-haspopup="dialog" aria-label="Tìm địa điểm">
          <svg class="search-trigger__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="search-trigger__label">Tìm kiếm</span>
          <kbd>⌘K</kbd>
        </button>
        <a class="icon-btn" href="https://github.com/Nutlope/nyc-ai-atlas" target="_blank" rel="noreferrer noopener" aria-label="Xem mã nguồn gốc trên GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5C5.37.5 0 5.78 0 12.29c0 5.2 3.44 9.6 8.21 11.16.6.11.82-.25.82-.56 0-.28-.01-1.02-.02-2-3.34.7-4.04-1.58-4.04-1.58-.55-1.36-1.33-1.73-1.33-1.73-1.09-.73.08-.71.08-.71 1.2.08 1.83 1.21 1.83 1.21 1.07 1.8 2.81 1.28 3.5.98.11-.76.42-1.28.76-1.57-2.67-.3-5.47-1.3-5.47-5.79 0-1.28.47-2.33 1.23-3.15-.12-.29-.53-1.49.12-3.11 0 0 1-.31 3.3 1.2.96-.26 1.98-.39 3-.4 1.02.01 2.04.14 3 .4 2.28-1.51 3.29-1.2 3.29-1.2.65 1.62.24 2.82.12 3.11.77.82 1.23 1.87 1.23 3.15 0 4.5-2.81 5.48-5.49 5.77.43.36.81 1.09.81 2.2 0 1.59-.01 2.87-.01 3.26 0 .31.21.68.83.56C20.57 21.88 24 17.48 24 12.29 24 5.78 18.63.5 12 .5Z"/></svg>
        </a>
      </div>

      <aside class="mini-map" aria-label="Bản đồ thu nhỏ">
        <svg id="miniMapSvg" viewBox="0 0 120 160" role="img" aria-label="Phác thảo Hà Nội và khu vực đang xem">
          <!-- West-bank city (with the West Lake notch), then the east bank
               across the Red River band. -->
          <path
            class="mini-map__land"
            d="M6 154 L6 8 L50 8 L52 18 L42 22 L36 32 L38 44 L48 50 L56 42 L52 26 L56 12 L62 28 L58 46 L64 62 L72 78 L76 96 L80 118 L84 154 Z"
          />
          <path class="mini-map__brooklyn" d="M72 8 L114 8 L114 154 L96 154 L92 116 L86 92 L80 72 L70 52 L66 34 L68 18 Z" />
          <g id="miniMapPoints"></g>
        </svg>
        <p>HÀ NỘI</p>
      </aside>

    </div>

    <dialog id="searchModal" class="search-modal" aria-label="Tìm địa điểm">
      <div class="search-modal__bar">
        <svg class="search-modal__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="companySearch" type="search" autocomplete="off" placeholder="Tìm 52 địa điểm: phở, di tích, dự án, khu vực…" aria-label="Tìm địa điểm" />
        <kbd class="search-modal__esc">esc</kbd>
      </div>
      <div id="searchResults" class="search-results" role="listbox"></div>
    </dialog>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
